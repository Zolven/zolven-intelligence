# Weekly rebase of the Zolven branding patch onto upstream OpenClaw, then
# publish a pre-built tarball as a GitHub Release asset.
#
# Flow:
#   1. Fast-forward our `upstream-main` branch to openclaw/openclaw:main.
#   2. Resolve the latest upstream stable tag (`vYYYY.M.D` with no prerelease
#      suffix) and replay only the Zolven fork commits onto it. Upstream stable
#      tags are not always linear with each other, so replaying from the
#      previous fork base avoids dragging old upstream release commits forward.
#      On conflict, open an issue and stop — humans resolve.
#   3. `pnpm install` + `pnpm check` (typecheck + lint + static checks). Test
#      suite is intentionally skipped — see "Run check suite" note.
#   4. Resolve the fork version `<upstream-stable>-zolven.<run-number>` and
#      write it into package.json AND npm-shrinkwrap.json (both ship in the
#      tarball; a stale shrinkwrap version contradicts the manifest).
#   5. Build the tarball as the fixed filename `zolven-intelligence.tgz`, then
#      SMOKE-INSTALL it (`npm install -g` into a throwaway prefix) and verify
#      the installed version and both bins. Nothing immutable exists yet: a
#      broken artifact fails here with no tag pushed. (v2026.7.1-alfred.39
#      shipped uninstallable because packing was validated only by releasing.)
#   6. Only after the smoke passes — and only when skip_release is false —
#      create the release-only bump commit and tag, push the tag, and attach
#      the tarball to a GitHub Release published as latest so
#      `releases/latest/download/…` immediately resolves to it. The bump
#      commit is intentionally left on the tag only so the next rebase does
#      not have to replay stale `release:` commits. With skip_release=true the
#      run is genuinely rebase-and-pack-only: no commit, no tag, no release.
#
# No npm registry, no NPM_TOKEN. Release assets ride on the default
# GITHUB_TOKEN.

name: Rebase on upstream + publish GitHub Release

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      skip_release:
        description: "Rebase and pack only; skip creating a GitHub Release."
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  FORK_BRANCH: main

concurrency:
  group: zolven-rebase-publish
  cancel-in-progress: false

jobs:
  rebase-and-publish:
    # GitHub schedules execute from the default branch. Guard against the
    # workflow being dispatched from a topic branch and force-pushing main.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    # The prepack build (tsdown core + all bundled extensions) runs on a
    # 2-core hosted runner; observed 2.5h+ on 2026-07-29 (run 30463038341 hit
    # the previous 150-minute limit mid-prepack). Hosted-runner speed varies
    # widely — keep generous headroom.
    timeout-minutes: 300
    steps:
      - name: Checkout fork branch (full history)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure bot identity
        run: |
          git config user.name "zolven-intelligence-bot"
          git config user.email "bot@zolven.ai"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/openclaw/openclaw.git || true
          git fetch upstream main --tags

      - name: Fast-forward upstream-main mirror (tracking only, best-effort)
        run: |
          # upstream-main is an informational mirror of openclaw/openclaw:main
          # visible on our fork. It's NOT used by the rebase or publish steps.
          # The default GITHUB_TOKEN lacks the `workflows` permission, so pushes
          # that touch upstream's `.github/workflows/*` fail. Swallow those so
          # a workflow-file churn upstream doesn't block our release pipeline.
          git checkout -B upstream-main upstream/main
          if ! git push origin upstream-main --force-with-lease; then
            echo "::warning::Could not fast-forward upstream-main (likely workflow-file churn upstream). Continuing; upstream/main ref is still up to date locally and drives the rebase."
          fi
          git checkout "$FORK_BRANCH"

      - name: Resolve latest upstream stable tag
        id: stable
        run: |
          # Pick the latest `vYYYY.M.D` tag with no suffix (pure upstream
          # calver stable). We anchor the pattern so our own suffixed fork tags
          # don't win the `sort -V | tail -1` race — GNU sort treats a suffix
          # as extending the base version and
          # ranks it AFTER the bare tag, so a loose filter would point the
          # rebase at our previous release instead of upstream.
          stable_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ -z "$stable_tag" ]; then
            echo "::error::Could not find a stable upstream tag (v<YYYY>.<M>.<D>)."
            exit 1
          fi
          stable_sha="$(git rev-parse "$stable_tag")"
          stable_version="${stable_tag#v}"
          echo "tag=$stable_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$stable_sha" >> "$GITHUB_OUTPUT"
          echo "version=$stable_version" >> "$GITHUB_OUTPUT"
          echo "Rebase target: $stable_tag ($stable_sha)"

      - name: Resolve current fork base tag
        id: base
        run: |
          current_version="$(
            node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('./package.json','utf8'));const m=/^([0-9]+\\.[0-9]+\\.[0-9]+)(?:-zolven\\.[0-9]+)?$/.exec(p.version);if(!m){process.exit(1)}process.stdout.write(m[1]);"
          )"
          current_tag="v${current_version}"
          if git rev-parse -q --verify "${current_tag}^{commit}" >/dev/null && git merge-base --is-ancestor "$current_tag" HEAD; then
            echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            echo "Current fork base: $current_tag"
          else
            echo "::warning::Could not verify current fork base tag ${current_tag}; falling back to a plain rebase."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase fork branch onto upstream stable tag
        id: rebase
        run: |
          git checkout "$FORK_BRANCH"
          target="${{ steps.stable.outputs.tag }}"
          current="${{ steps.base.outputs.tag }}"

          if [ -n "$current" ] && [ "$current" != "$target" ]; then
            echo "Replaying fork-local commits from ${current}..HEAD onto ${target}."
            if ! (
              set -e
              mapfile -t fork_commits < <(git rev-list --reverse "${current}..HEAD")
              git checkout -B fork-rebased "$target"
              for commit in "${fork_commits[@]}"; do
                subject="$(git log -1 --format=%s "$commit")"
                if [[ "$subject" =~ ^release:\ [0-9]+\.[0-9]+\.[0-9]+-zolven\.[0-9]+$ ]]; then
                  echo "::notice::Skipping previous release-only commit ${commit:0:12}: ${subject}"
                  continue
                fi
                git cherry-pick --empty=drop "$commit"
              done
              git branch -f "$FORK_BRANCH" HEAD
              git checkout "$FORK_BRANCH"
            ); then
              git cherry-pick --abort || true
              git checkout "$FORK_BRANCH" || true
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if ! git rebase "$target"; then
              git rebase --abort || true
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Open conflict issue if rebase failed
        if: failure() && steps.rebase.outputs.conflict == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tag = "${{ steps.stable.outputs.tag }}";
            const sha = "${{ steps.stable.outputs.sha }}".slice(0, 12);
            const forkBranch = process.env.FORK_BRANCH;
            const title = `Rebase conflict against openclaw/openclaw@${tag}`;
            const body = [
              `The scheduled rebase of \`${forkBranch}\` onto \`${tag}\` (\`${sha}\`) failed.`,
              ``,
              `Resolve locally:`,
              "```",
              `git fetch upstream --tags`,
              `git checkout ${forkBranch}`,
              `git rebase --onto ${tag} ${{ steps.base.outputs.tag || '<previous-upstream-base-tag>' }} ${forkBranch}`,
              `# fix conflicts, re-stage, git rebase --continue`,
              `git push --force-with-lease origin ${forkBranch}`,
              "```",
              ``,
              `Re-run this workflow after the branch is pushed.`,
            ].join("\n");
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["rebase-conflict", "automation"],
              });
            } catch (error) {
              const status = error && typeof error === "object" && "status" in error ? error.status : "unknown";
              const message = error instanceof Error ? error.message : String(error);
              core.warning(`Could not open rebase conflict issue (status ${status}): ${message}`);
            }

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22
          install-bun: "false"
          install-deps: "false"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Run check suite
        id: check
        # We keep the broad static/type gates from `pnpm check`, but avoid the
        # repo-wide `pnpm lint` lane because upstream stable tags can ship
        # unrelated oxlint failures in files the Zolven fork does not touch.
        # Instead, lint the fork-local JS/TS diff against the chosen upstream
        # rebase target. Runtime smoke still happens post-publish via
        # `zolven-intelligence telegram set`.
        run: |
          pnpm check:no-conflict-markers
          pnpm tool-display:check
          pnpm check:host-env-policy:swift
          pnpm tsgo:all

          fork_lint_files=()
          while IFS= read -r file; do
            fork_lint_files+=("$file")
          done < <(
            git diff --name-only "${{ steps.stable.outputs.tag }}"..HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs'
          )
          if [ "${#fork_lint_files[@]}" -gt 0 ]; then
            pnpm exec oxlint "${fork_lint_files[@]}"
          else
            echo "No fork-local JS/TS files changed relative to ${{ steps.stable.outputs.tag }}; skipping targeted oxlint."
          fi

          pnpm lint:webhook:no-low-level-body-read
          pnpm lint:auth:no-pairing-store-group
          pnpm lint:auth:pairing-account-scope
          pnpm check:import-cycles
          pnpm check:madge-import-cycles

      - name: Push rebased branch
        run: git push origin "HEAD:${FORK_BRANCH}" --force-with-lease

      - name: Resolve fork release version
        id: next
        run: |
          base="${{ steps.stable.outputs.version }}"
          next="${base}-zolven.${GITHUB_RUN_NUMBER}"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Release version: $next"

      - name: Apply release version for packaging
        # Uncommitted on purpose: the tarball must carry the release version,
        # but the tag-only bump commit is created later, after the packed
        # artifact has survived the install smoke. npm-shrinkwrap.json ships
        # in the tarball, so its version fields must move with package.json.
        run: |
          node -e "
            const fs = require('node:fs');
            const next = '${{ steps.next.outputs.version }}';
            for (const file of ['package.json', 'npm-shrinkwrap.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = next;
              if (json.packages && json.packages['']) json.packages[''].version = next;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
          "

      - name: Pack the npm tarball
        id: pack
        run: |
          # Run prepack explicitly, then remove generated dependency trees that
          # package.json excludes. npm/pnpm still walks excluded trees while
          # applying packlist filters, and those extension runtime deps dominate
          # the runner's file count.
          echo "prepack starting at $(date -u +%T)"
          pnpm run prepack
          echo "prepack done at $(date -u +%T)"
          if [ -d dist/extensions ]; then
            find dist/extensions -path '*/node_modules' -type d -prune -exec rm -rf {} +
            find dist/extensions -path '*/.openclaw-runtime-deps-*' -type d -prune -exec rm -rf {} +
            find dist/extensions -name '.openclaw-runtime-deps-stamp.json' -type f -delete
          fi
          du -sh dist dist/extensions 2>/dev/null || true

          # Drop every installed dependency tree before packing. npm pack walks
          # the whole directory tree while applying packlist filters, and the
          # installed workspace graph (150+ node_modules trees) makes that walk
          # dominate wall-clock on 2-core runners. Nothing after the prepack
          # build needs installed deps: npm pack runs with --ignore-scripts and
          # the remaining steps only use gh/git.
          echo "node_modules prune starting at $(date -u +%T)"
          find . -name node_modules -type d -prune -exec rm -rf {} +
          echo "node_modules prune done at $(date -u +%T)"

          # Pack without rerunning prepack, and write the fixed asset name
          # Zolven's installer relies on. Use npm for the final tarball: pnpm
          # can still spend minutes calculating the packlist from the installed
          # workspace graph after the build is complete.
          # https://github.com/Zolven/zolven-intelligence/releases/latest/download/zolven-intelligence.tgz
          # Resolve pnpm's `workspace:` protocol before packing. `pnpm pack`
          # rewrites those specifiers to concrete versions on the way out; we
          # pack with npm (see above) for speed, and npm copies them verbatim.
          # That was harmless until upstream v2026.7.1 added
          # `"@openclaw/ai": "workspace:*"` to the root dependencies: the
          # published package.json then carried a protocol npm cannot resolve,
          # and every `npm install -g <tarball>` died with
          # EUNSUPPORTEDPROTOCOL — the historical v2026.7.1-alfred.39 release shipped uninstallable.
          # Versions come from the workspace packages themselves, which is
          # exactly the substitution pnpm would have made.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const roots = ["packages", "extensions", "examples", "ui", "."];
            const versions = new Map();
            for (const root of roots) {
              const dirs = root === "." || root === "ui"
                ? [root]
                : (fs.existsSync(root) ? fs.readdirSync(root).map((d) => path.join(root, d)) : []);
              for (const dir of dirs) {
                const manifest = path.join(dir, "package.json");
                if (!fs.existsSync(manifest)) continue;
                try {
                  const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
                  if (pkg.name && pkg.version && !versions.has(pkg.name)) {
                    versions.set(pkg.name, pkg.version);
                  }
                } catch {}
              }
            }
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const rewritten = [];
            for (const section of ["dependencies", "optionalDependencies", "peerDependencies"]) {
              const deps = pkg[section];
              if (!deps) continue;
              for (const [name, spec] of Object.entries(deps)) {
                if (typeof spec !== "string" || !spec.startsWith("workspace:")) continue;
                const version = versions.get(name);
                if (!version) {
                  console.error(`::error::${section}.${name} is "${spec}" but no workspace package provides it; the tarball would be uninstallable.`);
                  process.exit(1);
                }
                deps[name] = version;
                rewritten.push(`${section}.${name}: ${spec} -> ${version}`);
              }
            }
            if (rewritten.length) {
              fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
              console.log(`Resolved workspace protocols:\n  ${rewritten.join("\n  ")}`);
            } else {
              console.log("No workspace: specifiers to resolve.");
            }
          '

          echo "npm pack starting at $(date -u +%T)"
          pack_log="$(mktemp)"
          pack_dir="$(mktemp -d)"
          if ! npm pack --ignore-scripts --pack-destination "$pack_dir" >"$pack_log" 2>&1; then
            cat "$pack_log"
            exit 1
          fi
          sed -n '/^npm notice Tarball Details/,$p' "$pack_log"
          built_tarball="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' -type f | head -1 || true)"
          if [ -z "$built_tarball" ]; then
            echo "::error::npm pack produced no tarball."
            exit 1
          fi
          mv "$built_tarball" zolven-intelligence.tgz
          asset_size="$(stat -c '%s' zolven-intelligence.tgz 2>/dev/null || stat -f '%z' zolven-intelligence.tgz)"
          echo "asset=zolven-intelligence.tgz" >> "$GITHUB_OUTPUT"
          echo "bytes=$asset_size" >> "$GITHUB_OUTPUT"
          echo "Tarball: zolven-intelligence.tgz ($asset_size bytes)"

      - name: Smoke-install the tarball
        # The only proof a tarball installs is installing it. This runs the
        # same command the Zolven installer runs, into a throwaway prefix,
        # before any tag or release exists — the failure mode that shipped
        # v2026.7.1-alfred.39 (EUNSUPPORTEDPROTOCOL at install time) dies
        # here instead of in front of a customer.
        run: |
          prefix="$(mktemp -d)"
          npm install -g --prefix "$prefix" ./zolven-intelligence.tgz

          manifest="$prefix/lib/node_modules/openclaw/package.json"
          installed_version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('$manifest','utf8')).version)")"
          expected="${{ steps.next.outputs.version }}"
          if [ "$installed_version" != "$expected" ]; then
            echo "::error::Installed package version is ${installed_version}, expected ${expected} (shrinkwrap/manifest drift)."
            exit 1
          fi

          for bin in zolven-intelligence openclaw; do
            if [ ! -x "$prefix/bin/$bin" ]; then
              echo "::error::Installed package does not expose an executable '$bin' bin."
              exit 1
            fi
          done
          timeout 120 "$prefix/bin/zolven-intelligence" --version
          # --version never loads the agent/channel chunks; prove every import
          # they make from registry-installed @openclaw/* packages resolves.
          node scripts/check-published-openclaw-imports.mjs "$prefix/lib/node_modules/openclaw"
          echo "Smoke install OK: openclaw@${installed_version} (bins: zolven-intelligence, openclaw)"

      - name: Resolve release gate
        id: gate
        env:
          SKIP_RELEASE: ${{ inputs.skip_release }}
        run: |
          if [ "$SKIP_RELEASE" = "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skip_release input set; skipping GitHub Release creation."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit release bump and push tag
        if: steps.gate.outputs.release == 'true'
        run: |
          # The pack step rewrote package.json (workspace: resolution) and
          # pruned node_modules; restore tracked state and re-apply only the
          # version bump so the tag carries a clean, version-only commit.
          # The commit stays tag-only (the branch was already pushed), same
          # contract as before: the next rebase never replays release commits.
          git checkout -- package.json npm-shrinkwrap.json
          next="${{ steps.next.outputs.version }}"
          node -e "
            const fs = require('node:fs');
            const next = '${next}';
            for (const file of ['package.json', 'npm-shrinkwrap.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = next;
              if (json.packages && json.packages['']) json.packages[''].version = next;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
          "
          git add package.json npm-shrinkwrap.json
          git commit -m "release: ${next}" --no-verify
          git tag -a "v${next}" -m "Zolven Intelligence ${next}"
          git push origin "v${next}"

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.next.outputs.tag }}"
          version="${{ steps.next.outputs.version }}"
          upstream_tag="${{ steps.stable.outputs.tag }}"
          notes=$(cat <<EOF
          Zolven Intelligence \`${version}\`.

          Rebased onto upstream \`${upstream_tag}\`. Branding patch applies cleanly.

          Asset: \`zolven-intelligence.tgz\` (fixed name for installer consumption).
          Consume via:

          \`\`\`
          npm install -g https://github.com/Zolven/zolven-intelligence/releases/latest/download/zolven-intelligence.tgz
          \`\`\`

          This release is published as the latest normal GitHub Release so
          fresh installs using \`releases/latest/download/…\` consume this
          tarball immediately.
          EOF
          )
          gh release create "$tag" zolven-intelligence.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zolven Intelligence ${version}" \
            --notes "$notes" \
            --latest

      - name: Summary
        if: always()
        run: |
          echo "### Zolven rebase + release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream stable tag: \`${{ steps.stable.outputs.tag || '(not resolved)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream sha: \`${{ steps.stable.outputs.sha || '(n/a)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fork version: \`${{ steps.next.outputs.version || '(not resolved)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tarball: \`${{ steps.pack.outputs.asset || '(not packed)' }}\` (${{ steps.pack.outputs.bytes || '—' }} bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Release: \`${{ steps.gate.outputs.release || 'false' }}\` (latest)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
